<!DOCTYPE html>
<html>

<head>
    <title>Task 1 - Product Card</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .container {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background-color: #ffffff;
            width: 270px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.25);
        }

        .card img {
            width: 100%;
            height: 270px;
            object-fit: cover;

        }

        .card h3 {
            font-size: 18px;
            color: #212529;
            margin: 14px 0 6px 0;
        }

        .card p {
            font-size: 13px;
            color: #6c757d;
            margin: 0 0 10px 0;
            line-height: 1.4;
        }

        .price {
            font-family:Arial, Helvetica, sans-serif;
            font-size: 14px;
            color: #495057;
            margin-bottom: 14px;
        }

        .price del {
            color: #adb5bd;
            margin-right: 6px;
        }

        .price strong {
            color: darkgray;
            font-size: 30px;
        }

        .card button {
            background-color: maroon;
            color: #ffffff;
            border: none;
            width: 40%;
            padding: 15px 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .card button:hover {
            background-color: white;
            color: maroon;
            border: 1px solid maroon;
        }

        .text-wraper {
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <img src="tshirt.jpg" alt="White Drop Shoulder T-Shirt">
            <div class="text-wraper">
                <h3 style="color: maroon;" >Solid White Drop Shoulder</h3>
                <div class="price"><strong>15$</strong> <del>25$</del></div>
                <p>100% premium combed cotton, breathable fabric with a clean minimalist aesthetic.</p>
                <button type="button">BUY NOW</button>
            </div>
        </div>

        <div class="card">
            <img src="tshirt2.jpeg" alt="Black Graphic T-Shirt">
            <div class="text-wraper">
                <h3 style="color: maroon;">Anime Graphic T-Shirt</h3>
                <div class="price"><strong>15$</strong> <del>25$</del> </div>
                <p>Heavyweight cotton fabric with high-density anime print & trendy streetwear fit.</p>
                <button type="button">BUY NOW</button>
            </div>
        </div>
    </div>

</body>

</html>
